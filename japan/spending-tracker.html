<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan · Spend Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#F4EFE3;
    --washi-2:#ECE5D4;
    --sumi:#1B2530;
    --sumi-soft:#41505d;
    --line:#d8cfbb;
    --seal:#C0432B;
    --tokyo:#27506B;
    --kyoto:#C0432B;
    --osaka:#C2862A;
    --green:#3a7d5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--washi);
    color:var(--sumi);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-bottom:60px;
  }
  .mono{font-family:"Space Mono",monospace}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px}

  /* HERO */
  .hero{padding:48px 20px 28px;max-width:680px;margin:0 auto}
  .seal{
    width:64px;height:64px;border:2.5px solid var(--seal);border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:var(--seal);font-family:"Shippori Mincho",serif;font-weight:800;font-size:32px;
    transform:rotate(-4deg);margin-bottom:20px;
  }
  .eyebrow{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sumi-soft)}
  .hero h1{
    font-family:"Shippori Mincho",serif;font-weight:800;
    font-size:clamp(44px,14vw,72px);line-height:.96;letter-spacing:-.01em;margin:6px 0 4px;
  }
  .hero h1 .jp{color:var(--seal);font-size:.58em;margin-left:.06em;font-weight:700}
  .hero p{color:var(--sumi-soft);font-size:14px;margin-top:10px}

  hr.divider{border:none;border-top:1.5px solid var(--line);margin:28px 0}

  /* TOTALS */
  .totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px}
  .total-card{
    background:var(--washi-2);border:1.5px solid var(--line);border-radius:12px;
    padding:16px;text-align:center;
  }
  .total-card .label{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--sumi-soft);margin-bottom:6px}
  .total-card .amount{font-family:"Shippori Mincho",serif;font-weight:700;font-size:22px;color:var(--sumi)}
  .total-card .sub{font-size:11px;color:var(--sumi-soft);margin-top:2px}
  .total-card.highlight .amount{color:var(--seal)}

  /* CATEGORY PILLS */
  .cat-breakdown{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .cat-pill{
    background:var(--washi-2);border:1.5px solid var(--line);border-radius:20px;
    padding:5px 14px;font-size:13px;display:flex;align-items:center;gap:6px;
  }
  .cat-pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .cat-pill .cat-name{color:var(--sumi-soft)}
  .cat-pill .cat-amt{font-family:"Space Mono",monospace;font-size:11px;color:var(--sumi);font-weight:700}

  /* ADD FORM */
  .form-card{
    background:var(--washi-2);border:1.5px solid var(--line);border-radius:14px;
    padding:22px;margin-bottom:28px;
  }
  .form-card h2{font-family:"Shippori Mincho",serif;font-weight:700;font-size:20px;margin-bottom:16px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .form-row.full{grid-template-columns:1fr}
  .field label{display:block;font-size:11px;font-family:"Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--sumi-soft);margin-bottom:5px}
  .field input,.field select{
    width:100%;padding:10px 12px;
    background:var(--washi);border:1.5px solid var(--line);border-radius:8px;
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;color:var(--sumi);
    outline:none;transition:border-color .15s;
    -webkit-appearance:none;appearance:none;
  }
  .field input:focus,.field select:focus{border-color:var(--seal)}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  .field.amount-field{position:relative}
  .field.amount-field .prefix{
    position:absolute;bottom:10px;left:12px;font-family:"Space Mono",monospace;font-size:14px;color:var(--sumi-soft);pointer-events:none;
  }
  .field.amount-field input{padding-left:28px}
  .btn-add{
    width:100%;padding:12px;background:var(--seal);color:#fff;border:none;border-radius:8px;
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;font-weight:700;
    cursor:pointer;transition:opacity .15s;margin-top:4px;
  }
  .btn-add:hover{opacity:.88}

  /* EXPENSE LIST */
  .section-title{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sumi-soft);margin-bottom:14px}
  .expense-list{display:flex;flex-direction:column;gap:10px}
  .expense-item{
    background:var(--washi-2);border:1.5px solid var(--line);border-radius:12px;
    padding:14px 16px;display:flex;align-items:center;gap:14px;
  }
  .expense-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .expense-info{flex:1;min-width:0}
  .expense-desc{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .expense-meta{font-size:12px;color:var(--sumi-soft);margin-top:1px}
  .expense-amount{font-family:"Space Mono",monospace;font-size:14px;font-weight:700;flex-shrink:0;text-align:right}
  .expense-amount .jpy{display:block;font-size:13px}
  .expense-amount .usd{display:block;font-size:10px;color:var(--sumi-soft);margin-top:1px}
  .btn-del{
    background:none;border:none;cursor:pointer;color:var(--line);font-size:16px;
    padding:4px;border-radius:6px;transition:color .15s;flex-shrink:0;
  }
  .btn-del:hover{color:var(--seal)}

  .empty{text-align:center;color:var(--sumi-soft);font-size:14px;padding:32px 0;font-style:italic}

  /* CATEGORY COLORS */
  .c-food{background:#C2862A}
  .c-transport{background:#27506B}
  .c-stay{background:#6B4F8C}
  .c-activities{background:#C0432B}
  .c-shopping{background:#3a7d5a}
  .c-other{background:#888}

  @media(max-width:480px){
    .totals{grid-template-columns:1fr 1fr}
    .form-row{grid-template-columns:1fr}
    .total-card:last-child{grid-column:span 2}
  }
</style>
</head>
<body>

<div class="hero wrap">
  <div class="seal">¥</div>
  <div class="eyebrow">Japan · Oct 19–29</div>
  <h1>Spend<br><span class="jp">支出</span></h1>
  <p>Track every yen. Tap + to add an expense.</p>
</div>

<div class="wrap">
  <hr class="divider">

  <!-- TOTALS -->
  <div class="totals">
    <div class="total-card highlight">
      <div class="label">Total ¥</div>
      <div class="amount" id="total-jpy">¥0</div>
      <div class="sub">Japanese Yen</div>
    </div>
    <div class="total-card">
      <div class="label">Total $</div>
      <div class="amount" id="total-usd">$0</div>
      <div class="sub">≈ USD</div>
    </div>
    <div class="total-card">
      <div class="label">Expenses</div>
      <div class="amount" id="total-count">0</div>
      <div class="sub">items logged</div>
    </div>
  </div>

  <!-- CATEGORY BREAKDOWN -->
  <div class="cat-breakdown" id="cat-breakdown"></div>

  <hr class="divider">

  <!-- ADD FORM -->
  <div class="form-card">
    <h2>Add Expense</h2>
    <div class="form-row">
      <div class="field">
        <label>Description</label>
        <input type="text" id="f-desc" placeholder="Ramen at Ichiran…" autocomplete="off">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="f-cat">
          <option value="food">🍜 Food & Drink</option>
          <option value="transport">🚄 Transport</option>
          <option value="stay">🏨 Stay</option>
          <option value="activities">⛩ Activities</option>
          <option value="shopping">🛍 Shopping</option>
          <option value="other">✦ Other</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="field amount-field">
        <label>Amount
          <span style="margin-left:8px;font-family:'Space Mono',monospace;font-size:10px">
            <button type="button" id="cur-jpy" onclick="setCur('jpy')" style="background:var(--seal);color:#fff;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:10px">¥ JPY</button>
            <button type="button" id="cur-usd" onclick="setCur('usd')" style="background:none;color:var(--sumi-soft);border:1.5px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:10px">$ USD</button>
          </span>
        </label>
        <span class="prefix" id="cur-prefix">¥</span>
        <input type="number" id="f-amount" placeholder="1200" min="0">
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="form-row full">
      <div class="field">
        <label>Note (optional)</label>
        <input type="text" id="f-note" placeholder="Shared between 4 people…" autocomplete="off">
      </div>
    </div>
    <button class="btn-add" id="btn-add" onclick="addExpense()">+ Add Expense</button>
    <div id="sync-status" style="text-align:center;font-size:12px;margin-top:10px;color:var(--sumi-soft);min-height:18px"></div>
  </div>

  <!-- LIST -->
  <div class="section-title">All Expenses</div>
  <div class="expense-list" id="expense-list">
    <div class="empty">No expenses yet — add your first one above.</div>
  </div>
</div>

<script>
const JPY_TO_USD = 0.0067; // ~149 JPY per USD — update as needed
const USD_TO_JPY = Math.round(1 / JPY_TO_USD);

// Paste your Google Apps Script web app URL here after deploying
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBv8On-s_wlym5E9y3Ur_fGCw2YE360uoR_WH3OivWx-c-A7HXYGcFEQZnUERGfpQP/exec";

let activeCur = "jpy";

function setCur(cur) {
  activeCur = cur;
  document.getElementById("cur-prefix").textContent = cur === "jpy" ? "¥" : "$";
  document.getElementById("f-amount").placeholder = cur === "jpy" ? "1200" : "8";
  const jpy = document.getElementById("cur-jpy");
  const usd = document.getElementById("cur-usd");
  if (cur === "jpy") {
    jpy.style.cssText = "background:var(--seal);color:#fff;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:10px";
    usd.style.cssText = "background:none;color:var(--sumi-soft);border:1.5px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:10px";
  } else {
    usd.style.cssText = "background:var(--tokyo);color:#fff;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:10px";
    jpy.style.cssText = "background:none;color:var(--sumi-soft);border:1.5px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer;font-size:10px";
  }
}

const CAT = {
  food:       { label: "Food & Drink",  cls: "c-food" },
  transport:  { label: "Transport",     cls: "c-transport" },
  stay:       { label: "Stay",          cls: "c-stay" },
  activities: { label: "Activities",    cls: "c-activities" },
  shopping:   { label: "Shopping",      cls: "c-shopping" },
  other:      { label: "Other",         cls: "c-other" },
};

function load() {
  return JSON.parse(localStorage.getItem("japan-expenses") || "[]");
}

function save(data) {
  localStorage.setItem("japan-expenses", JSON.stringify(data));
}

function fmt(n) {
  return n.toLocaleString();
}

function render() {
  const data = load();
  const list = document.getElementById("expense-list");
  const totalJpy = data.reduce((s, e) => s + e.jpy, 0);
  const totalUsd = totalJpy * JPY_TO_USD;

  document.getElementById("total-jpy").textContent = "¥" + fmt(totalJpy);
  document.getElementById("total-usd").textContent = "$" + totalUsd.toFixed(0);
  document.getElementById("total-count").textContent = data.length;

  // category breakdown
  const bycat = {};
  data.forEach(e => { bycat[e.cat] = (bycat[e.cat] || 0) + e.jpy; });
  const breakdown = document.getElementById("cat-breakdown");
  breakdown.innerHTML = Object.entries(bycat).map(([cat, amt]) => `
    <div class="cat-pill">
      <span class="dot ${CAT[cat].cls}"></span>
      <span class="cat-name">${CAT[cat].label}</span>
      <span class="cat-amt">¥${fmt(amt)}</span>
    </div>
  `).join("");

  if (data.length === 0) {
    list.innerHTML = '<div class="empty">No expenses yet — add your first one above.</div>';
    return;
  }

  list.innerHTML = [...data].reverse().map((e, ri) => {
    const i = data.length - 1 - ri;
    const usd = (e.jpy * JPY_TO_USD).toFixed(2);
    return `
    <div class="expense-item">
      <span class="expense-dot ${CAT[e.cat].cls}"></span>
      <div class="expense-info">
        <div class="expense-desc">${esc(e.desc)}</div>
        <div class="expense-meta">${CAT[e.cat].label} · ${e.date}${e.note ? " · " + esc(e.note) : ""}</div>
      </div>
      <div class="expense-amount">
        <span class="jpy">¥${fmt(e.jpy)}</span>
        <span class="usd">≈ $${usd}</span>
      </div>
      <button class="btn-del" onclick="del(${i})" title="Delete">✕</button>
    </div>`;
  }).join("");
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function setStatus(msg, color) {
  const el = document.getElementById("sync-status");
  el.textContent = msg;
  el.style.color = color || "var(--sumi-soft)";
}

async function syncToSheets(expense) {
  if (!SCRIPT_URL) return;
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(expense),
    });
    setStatus("✓ Saved to Google Sheets", "var(--green)");
  } catch {
    setStatus("⚠ Saved locally — Sheets sync failed", "var(--osaka)");
  }
}

async function addExpense() {
  const desc   = document.getElementById("f-desc").value.trim();
  const amount = parseFloat(document.getElementById("f-amount").value);
  const cat    = document.getElementById("f-cat").value;
  const date   = document.getElementById("f-date").value;
  const note   = document.getElementById("f-note").value.trim();

  if (!desc || !amount || amount <= 0) {
    alert("Please enter a description and a valid amount.");
    return;
  }

  const jpy = activeCur === "jpy" ? Math.round(amount) : Math.round(amount * USD_TO_JPY);

  const expense = { desc, jpy, cat, date: date || "—", note };
  const data = load();
  data.push(expense);
  save(data);
  render();

  document.getElementById("f-desc").value = "";
  document.getElementById("f-amount").value = "";
  document.getElementById("f-note").value = "";
  document.getElementById("f-desc").focus();

  if (SCRIPT_URL) {
    setStatus("Syncing to Google Sheets…", "var(--sumi-soft)");
    await syncToSheets(expense);
  }
}

function del(i) {
  if (!confirm("Delete this expense?")) return;
  const data = load();
  data.splice(i, 1);
  save(data);
  render();
}

// allow Enter to submit
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.target.id === "f-desc" || e.target.id === "f-amount" || e.target.id === "f-note")) {
    addExpense();
  }
});

// default date to today
document.getElementById("f-date").valueAsDate = new Date();

render();
</script>
</body>
</html>
